<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light dark"/><title>Preread</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><script>try { const preference = JSON.parse(localStorage.getItem('theme') || '"system"'); document.documentElement.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference; } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
